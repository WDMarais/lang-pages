<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>numerals lab · quantity referents</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/lxgwwenkai-regular.css">
<link rel="stylesheet" href="../shared/base.css">
<style>
  body { background:#faf8f4; color:#2b2b2b; }
  .lab-wrap { max-width:1100px; margin:0 auto; padding:2rem 1.25rem 4rem; }
  .lab-head { text-align:center; margin-bottom:.5rem; }
  .lab-head h1 { font-size:1.6rem; margin:0; font-weight:600; }
  .lab-head p { color:#7a7267; margin:.4rem 0 1.5rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:1rem; }
  .card { background:#fff; border:1px solid #ece7de; border-radius:14px; padding:1.1rem 1.1rem 1.3rem;
          box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .top { display:flex; align-items:baseline; gap:.6rem; margin-bottom:.9rem; }
  .glyph { font-family:'LXGW WenKai', serif; font-size:2.9rem; line-height:1; }
  .val   { font-size:1rem; color:#b8afa1; font-variant-numeric:tabular-nums; margin-left:auto; }
  .reading { font-size:.9rem; color:#8a8175; }
  .reading b { color:#5a5247; font-weight:600; }
  .ref-label { font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:#b4aa9b; margin:.7rem 0 .35rem; }
  /* dots */
  .dots { display:flex; flex-wrap:wrap; gap:.55rem; }
  .dot-cluster { display:inline-grid; grid-template-columns:repeat(5,10px); gap:4px;
                 padding:5px 7px; background:#f6f2ea; border-radius:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#c8462f; }
  /* tally */
  .tally { display:flex; flex-wrap:wrap; align-items:flex-end; gap:.5rem; min-height:52px; }
  .tally svg { width:46px; height:46px; display:block; }
  .tally svg.mark path.lit { fill:#2b2b2b; stroke:none; }
  .tally svg.mark.part path.lit { fill:#c8462f; }
  .tally svg.mark path.gh { fill:#eae4d9; stroke:none; }
</style>
</head>
<body class="hide-en">
<div class="lab-wrap">
  <div class="lab-head">
    <h1>数字 · quantity referents</h1>
    <p>The number's referent <em>is</em> the quantity — shown two ways. 正 = the East-Asian 5-stroke tally.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
// ── the one authored bit: glyph → integer value (+ readings for the lab) ──
const NUMS = [
  {g:'一', v:1,  py:'yī',  jp:'いち'},
  {g:'二', v:2,  py:'èr',  jp:'に'},
  {g:'三', v:3,  py:'sān', jp:'さん'},
  {g:'四', v:4,  py:'sì',  jp:'し・よん'},
  {g:'五', v:5,  py:'wǔ',  jp:'ご'},
  {g:'六', v:6,  py:'liù', jp:'ろく'},
  {g:'七', v:7,  py:'qī',  jp:'しち・なな'},
  {g:'八', v:8,  py:'bā',  jp:'はち'},
  {g:'九', v:9,  py:'jiǔ', jp:'きゅう・く'},
  {g:'十', v:10, py:'shí', jp:'じゅう'},
];

// 正 stroke paths (fetched once). makemeahanzi coord space: 1024 box, y-flipped.
let ZHENG = null;

function renderTally(v) {
  const full = Math.floor(v/5), rem = v % 5;
  let out = '';
  for (let i=0;i<full;i++) out += tallyMark(5, 'full');
  if (rem>0) out += tallyMark(rem, 'part');
  return `<div class="tally">${out}</div>`;
}
// one 正 mark: `lit` strokes inked (full=all 5 dark; part=rem in accent),
// the rest drawn as faint ghosts so you can see it's a partial 正.
function tallyMark(lit, kind) {
  const strokes = ZHENG.strokes;
  const paths = strokes.map((d,i) =>
    `<path class="${i<lit?'lit':'gh'}" d="${d}"/>`).join('');
  return `<svg viewBox="0 0 1024 1024" class="mark ${kind}">
    <g transform="scale(1,-1) translate(0,-900)">${paths}</g></svg>`;
}

function renderDots(v) {
  let out='';
  let left=v;
  while (left>0) {
    const n=Math.min(5,left); left-=n;
    let d=''; for(let i=0;i<n;i++) d+='<span class="dot"></span>';
    // pad cluster to keep the 5-grid alignment
    for(let i=n;i<5;i++) d+='<span></span>';
    out+=`<div class="dot-cluster">${d}</div>`;
  }
  return `<div class="dots">${out}</div>`;
}

function card(n){
  return `<div class="card">
    <div class="top"><span class="glyph">${n.g}</span><span class="val">${n.v}</span></div>
    <div class="reading"><b>${n.py}</b> · ${n.jp}</div>
    <div class="ref-label">dots</div>${renderDots(n.v)}
    <div class="ref-label">正 tally</div>${renderTally(n.v)}
  </div>`;
}

fetch('../shared/hanzi-data/正.json')
  .then(r=>r.json())
  .then(d=>{ ZHENG=d; document.getElementById('grid').innerHTML = NUMS.map(card).join(''); })
  .catch(e=>{ document.getElementById('grid').textContent='failed to load 正 stroke data: '+e; });
</script>
</body>
</html>
