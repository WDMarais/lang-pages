<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="告诉、听、懂：甲想到一朵花，说出来，声音进入乙的耳朵，乙的脑海里也浮现出一朵花"
     font-family="'Noto Serif CJK SC','Songti SC',serif">
  <rect x="0" y="0" width="400" height="200" fill="#F8F6F1"/>
  <!-- ── Person A: pictures a flower, and says it (告诉) ── -->
  <path d="M40 172 C42 148 90 148 92 172 Z" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="66" cy="112" r="22" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="3"/>
  <circle cx="72" cy="108" r="2" fill="#1E2A4A"/>
  <path d="M87 110 L94 115 L87 119" fill="none" stroke="#1E2A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="81" cy="122" rx="3.2" ry="4.2" fill="#C41E3A"/>
  <!-- A's thought: a flower (5 petals) -->
  <circle cx="50" cy="82" r="2.2" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="1.5"/>
  <circle cx="45" cy="74" r="2.8" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="1.5"/>
  <ellipse cx="54" cy="50" rx="30" ry="22" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="2"/>
  <path d="M54 60 v-5" stroke="#2C6B3E" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="58" cy="57" rx="3.6" ry="2.2" fill="#2C6B3E" transform="rotate(30 58 57)"/>
  <g fill="#C41E3A"><circle cx="54" cy="43" r="4.5"/><circle cx="47" cy="49" r="4.5"/><circle cx="61" cy="49" r="4.5"/><circle cx="50" cy="57" r="4.5"/><circle cx="58" cy="57" r="4.5"/></g>
  <circle cx="54" cy="50" r="3.5" fill="#B8963E"/>
  <!-- speech: A says words -->
  <path d="M116 120 L112 126 L122 122 Z" fill="#FFFFFF" stroke="#1E2A4A" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="100" y="98" width="40" height="22" rx="11" fill="#FFFFFF" stroke="#1E2A4A" stroke-width="1.5"/>
  <path d="M108 109 q5 -6 10 0 t10 0" fill="none" stroke="#B8963E" stroke-width="2" stroke-linecap="round"/>
  <!-- ── the words travel as sound, into the ear (听) ── -->
  <g stroke="#B8963E" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M160 98 Q174 118 160 138"/><path d="M176 102 Q187 118 176 134"/><path d="M192 106 Q200 118 192 130"/>
  </g>
  <!-- ── Person B: hears, and the picture forms in the mind (懂) ── -->
  <path d="M208 172 C210 148 258 148 260 172 Z" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M208 100 c13 -1 21 10 18 23 c-2 10 -11 16 -19 15 c-6 -1 -10 -6 -9 -11 c1 -4 6 -6 9 -3 c3 2 2 5 1 7"
        fill="#F8F6F1" stroke="#1E2A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="234" cy="120" r="22" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="3"/>
  <circle cx="227" cy="116" r="1.8" fill="#1E2A4A"/><circle cx="241" cy="116" r="1.8" fill="#1E2A4A"/>
  <path d="M226 126 Q234 133 242 126" fill="none" stroke="#1E2A4A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- B's thought trail -->
  <circle cx="256" cy="98" r="2.2" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="1.5"/>
  <circle cx="268" cy="86" r="2.8" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="1.5"/>
  <!-- B's thought: the same flower, reconstructed a little differently (6 petals) -->
  <ellipse cx="304" cy="56" rx="32" ry="24" fill="#F8F6F1" stroke="#1E2A4A" stroke-width="2"/>
  <path d="M304 66 v-5" stroke="#2C6B3E" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="309" cy="63" rx="3.6" ry="2.2" fill="#2C6B3E" transform="rotate(30 309 63)"/>
  <g fill="#C41E3A"><circle cx="304" cy="48" r="4"/><circle cx="311" cy="52" r="4"/><circle cx="311" cy="60" r="4"/><circle cx="304" cy="64" r="4"/><circle cx="297" cy="60" r="4"/><circle cx="297" cy="52" r="4"/></g>
  <circle cx="304" cy="56" r="3.3" fill="#B8963E"/>
  <!-- the aha: a small lantern that lights up, beside the picture -->
  <g stroke="#B8963E" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M362 33 v-6"/><path d="M381 41 l5 -4"/><path d="M343 41 l-5 -4"/><path d="M386 53 h6"/><path d="M338 53 h-6"/>
  </g>
  <path d="M362 41 v-3" stroke="#B8963E" stroke-width="1.6" fill="none"/>
  <rect x="357" y="41" width="10" height="4" rx="1.2" fill="#B8963E"/>
  <ellipse cx="362" cy="54" rx="10.5" ry="11.5" fill="#C41E3A"/>
  <path d="M362 44 V64" stroke="#B8963E" stroke-width="0.9" fill="none" opacity="0.5"/>
  <rect x="357" y="63" width="10" height="4" rx="1.2" fill="#B8963E"/>
  <path d="M362 67 v4" stroke="#B8963E" stroke-width="1.6" stroke-linecap="round"/>
  <!-- stage labels -->
  <text x="66" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#B8963E">告诉</text>
  <text x="214" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#B8963E">听</text>
  <text x="304" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#B8963E">懂</text>
</svg>
