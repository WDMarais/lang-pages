server {
    listen 80;
    server_name cn.wdmarais.dev;
    root /var/www/lang-pages;
    index index.html;

    # Default: the app shell, code, and page data (index.html, glyph.js, nodes.json…)
    # all live under STABLE filenames but are rewritten in place on every deploy, so
    # they must revalidate. `no-cache` = store but re-check before use; nginx emits an
    # ETag for static files, so a match is a cheap 304, not a refetch. An `immutable`
    # here was the 2026-07-19 stale-dossier bug: it pinned week-old glyph.js past even
    # a hard refresh.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Audio banks: large, keyed by sound (pinyin syllable / sentence digest), rewritten
    # only on a rare manual gen-audio run. Cache hard — but NOT immutable, so a hard
    # refresh can still bust a re-voiced clip. (Content-hashed banks could take
    # `immutable` later; the pinyin syllables are stable-name-but-mutable, so they don't.)
    location /audio/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Contributor authoring tool (/author/): a static, export-only form a helper uses
    # to hand-write a symbol JSON blob they then EMAIL — it has no write path to the box,
    # so this gate only controls who reaches the form, not what it can do. Real server-
    # side Basic Auth (page bytes withheld until authenticated), not an in-page JS check.
    # The credential file lives OUTSIDE the web root and is NOT in git — provision it once
    # with scripts/setup-author-auth.sh (regenerated per box; a secret, never committed).
    location /author/ {
        auth_basic "lang-pages authoring";
        auth_basic_user_file /etc/nginx/.htpasswd-author;
        # per-contributor access trail: Basic Auth records the username in $remote_user,
        # so this log answers "who used the tool, when" (grep by name). Each contributor
        # gets their own credential line — add them with scripts/setup-author-auth.sh.
        access_log /var/log/nginx/author.log;
    }
}
