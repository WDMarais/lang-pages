server {
    listen 80;
    server_name cn.wdmarais.dev;
    root /var/www/lang-pages;
    index index.html;

    # Default: the app shell, code, and page data (index.html, glyph.js, nodes.json…)
    # all live under STABLE filenames but are rewritten in place on every deploy, so
    # they must revalidate. `no-cache` = store but re-check before use; nginx emits an
    # ETag for static files, so a match is a cheap 304, not a refetch. An `immutable`
    # here was the 2026-07-19 stale-dossier bug: it pinned week-old glyph.js past even
    # a hard refresh.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Audio banks: large, keyed by sound (pinyin syllable / sentence digest), rewritten
    # only on a rare manual gen-audio run. Cache hard — but NOT immutable, so a hard
    # refresh can still bust a re-voiced clip. (Content-hashed banks could take
    # `immutable` later; the pinyin syllables are stable-name-but-mutable, so they don't.)
    location /audio/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
